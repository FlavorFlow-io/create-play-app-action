name: FlavorFlow Create Play App
description: >-
  Creates a Google Play Console app for one FlavorFlow client on a self-hosted
  runner. Runs unattended while the runner's Chrome session is valid, and
  notifies someone to sign in when it is not.

branding:
  icon: play
  color: purple

inputs:
  api-key:
    description: 'FlavorFlow project API key — reads the client name and package name'
    required: true
  project-id:
    description: 'FlavorFlow project id'
    required: true
  client-id:
    description: 'FlavorFlow client id to create the Play app for'
    required: true
  app-name:
    description: 'Override the app name (defaults to the client app name in FlavorFlow)'
    required: false
    default: ''
  profile-dir:
    description: >-
      Chrome profile carrying the Google session. Must already be signed in to
      Play Console — see the addon ci/README.md for the one-time setup.
    required: false
    default: '~/.config/google-chrome/gplay-automation-profile'
  chrome-binary:
    description: 'Path to the Chrome binary, when it is not on PATH'
    required: false
    default: ''
  default-language:
    description: 'Default store listing language'
    required: false
    default: 'en-US'
  app-type:
    description: 'app or game'
    required: false
    default: 'app'
  pricing:
    description: 'free or paid'
    required: false
    default: 'free'
  api-base-url:
    description: 'FlavorFlow API base URL'
    required: false
    default: 'https://api.flavorflow.io'
  session-timeout:
    description: 'Seconds a healthy stored session may take to reach the console'
    required: false
    default: '60'
  login-timeout:
    description: >-
      Seconds to wait for someone to sign in on the runner when the session has
      expired. This is the only step that needs a human.
    required: false
    default: '1800'
  notify-interval:
    description: 'Seconds between reminders while waiting for sign-in'
    required: false
    default: '300'
  notify-webhook:
    description: >-
      Optional URL posted to with {"text": ...} when a sign-in is needed —
      a Slack or Discord incoming webhook, for reaching someone not at the runner.
    required: false
    default: ''
  notify-desktop:
    description: 'Raise a desktop notification on the runner itself'
    required: false
    default: 'true'
  headless:
    description: >-
      Run Chrome headless. Off by default — a headless window cannot be signed
      in to, and Google challenges headless sessions far more often.
    required: false
    default: 'false'
  dry-run:
    description: 'Resolve the client and report what would happen, without a browser'
    required: false
    default: 'false'
  form:
    description: >-
      Forms to run: a single id, a comma-separated list, or "all" for every form
      the saved answers cover — which includes creating the app. Leave empty to
      use the older python create-only path.
    required: false
    default: ''
  form-params:
    description: >-
      Newline-separated k=v pairs bound to the form's {placeholders},
      e.g. "listName=Internal testers\nemails=a@example.com"
    required: false
    default: ''
  grant-service-account:
    description: >-
      After the app exists, give the workspace's linked Play service account
      access to it. Off by default so the two invocations of this action in one
      job do not both do it — set it on the one that creates the app. The
      workspace's "Grant access to new client apps" setting still decides
      whether it actually happens.
    required: false
    default: 'false'
  app-id:
    description: >-
      Play Console app id, when the app already exists. Creation is skipped and
      the remaining forms run against it. Normally unnecessary — a created id is
      remembered in state-dir — but needed to resume after a failed first run.
    required: false
    default: ''
  close-existing-chrome:
    description: >-
      Close a Chrome left holding the automation profile by a cancelled run,
      instead of stopping. Only that process — identified by the profile in its
      command line — is ever closed. Nothing is lost: the session lives in the
      profile on disk.
    required: false
    default: 'true'
  content-rating:
    description: >-
      Pre-answer the IARC questionnaire with "no" to everything, instead of
      using the answers saved against the project. Only "no" is supported.
      Off by default: these answers decide the age rating Google issues, so
      they are the project's to give rather than this action's to assume. A
      question nobody has answered now fails the run.
    required: false
    default: ''
  verify:
    description: >-
      After filling, print the console's own task list. A form reporting success
      is not the same as Play counting the task as done.
    required: false
    default: 'true'
  publish-to-production:
    description: >-
      After the forms above, promote the release to production: the console
      flow that creates the production draft, gives it countries, and rolls it
      out. Off by default, and deliberately so — everything else this action
      does is reversible, and this is not.

      Requires a release already published to internal testing, which is what
      Play promotes from.
    required: false
    default: 'false'
  data-safety-csv:
    description: >-
      Path to the Play Console Data safety CSV export, when it lives in the
      repository rather than being uploaded to FlavorFlow. Optional: without it
      the file uploaded against the project is used. Supplying it wins, so a
      repo copy can override the uploaded one.
    required: false
    default: ''
  countries:
    description: >-
      Countries for the production release, as the console spells them, comma
      separated. Blank means every country. Only read when
      publish-to-production is on.
    required: false
    default: ''
  force-create:
    description: >-
      Create a new Play app even when one is remembered for this app name. A
      package name cannot be changed after creation, so an app created with the
      wrong one can only be replaced.
    required: false
    default: 'false'
  developer-id:
    description: >-
      Play Console developer id. Supplying it skips Play's "Choose developer
      account" screen, which otherwise waits for a click nobody is there to make.
    required: false
    default: ''
  state-dir:
    description: >-
      Where remembered ids live. Defaults to ~/.flavorflow/gplay — deliberately
      outside the workspace, which checkout wipes each run.
    required: false
    default: ''
  cli-version:
    description: >-
      Release tag of the form-cli distribution to use. Defaults to the newest
      release of this action repo.
    required: false
    default: 'latest'

outputs:
  app-id:
    description: 'Play Console app id (empty when nothing was created)'
    value: ${{ steps.create.outputs.app-id || steps.forms.outputs.app-id }}
  created:
    description: 'true when this run created the app, false when it already existed'
    value: ${{ steps.create.outputs.created }}
  developer-id:
    description: 'Play Console developer id the app was created under'
    value: ${{ steps.create.outputs.developer-id }}

runs:
  using: composite
  steps:
    # This action drives a real desktop browser against a signed-in Google
    # session, which a GitHub-hosted runner can be neither of.
    - name: Check runner is self-hosted
      shell: bash
      run: |
        if [ "${RUNNER_ENVIRONMENT:-}" = "github-hosted" ]; then
          echo "::error::This action needs a self-hosted runner with a signed-in Chrome profile."
          exit 1
        fi

    # A venv rather than the system interpreter: Homebrew and modern distro
    # pythons are externally managed (PEP 668) and refuse a plain pip install.
    # Kept outside the workspace so it survives checkout cleaning.
    - name: Set up Python environment
      id: venv
      shell: bash
      run: |
        set -euo pipefail
        venv="${RUNNER_TOOL_CACHE:-$HOME/.cache}/flavorflow-play-venv"
        [ -x "$venv/bin/python" ] || python3 -m venv "$venv"
        "$venv/bin/python" -m pip install --quiet --disable-pip-version-check --upgrade pip selenium
        echo "python=$venv/bin/python" >> "$GITHUB_OUTPUT"
        "$venv/bin/python" -c 'import selenium; print("selenium", selenium.__version__)'

    - name: Resolve Chrome
      id: chrome
      shell: bash
      env:
        CHROME_BINARY: ${{ inputs.chrome-binary }}
      run: |
        set -euo pipefail
        candidates=(
          "$CHROME_BINARY"
          "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          "$HOME/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          "$(command -v google-chrome || true)"
          "$(command -v google-chrome-stable || true)"
          "$(command -v chromium || true)"
        )
        found=""
        for c in "${candidates[@]}"; do
          if [ -n "$c" ] && [ -x "$c" ]; then found="$c"; break; fi
        done
        if [ -z "$found" ]; then
          echo "::error::No Chrome found. Install Google Chrome on the runner, or set chrome-binary."
          exit 1
        fi
        echo "Using $found"
        "$found" --version || true
        echo "binary=$found" >> "$GITHUB_OUTPUT"
        # Selenium Manager fetches a matching chromedriver, so a missing one on
        # PATH is worth a note rather than a failure.
        command -v chromedriver >/dev/null 2>&1 \
          && chromedriver --version \
          || echo "chromedriver not on PATH — Selenium Manager will fetch one."

    # The runner is a JVM program, and a self-hosted Mac has no JDK on PATH by
    # default — the launcher then fails with "Unable to locate a Java Runtime".
    # 17 matches the toolchain the distribution is built with.
    - name: Work out the machine's real architecture
      if: inputs.form != '' || inputs.publish-to-production == 'true'
      id: hostarch
      shell: bash
      run: |
        # Ask the hardware, not the process. `runner.arch` describes the runner
        # agent — this one is the osx-x64 build on an Apple Silicon Mac, so it
        # says X64 — and `uname -m` reports x86_64 under Rosetta, so both lie
        # here. hw.optional.arm64 is a property of the CPU and cannot.
        if [ "$(sysctl -n hw.optional.arm64 2>/dev/null)" = "1" ]; then
          echo "java=aarch64" >> "$GITHUB_OUTPUT"
        else
          echo "java=x64" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up Java
      if: inputs.form != '' || inputs.publish-to-production == 'true'
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
        # Native, not the x64 build under Rosetta. Without this the runner got
        # an x86-64 JVM on Apple Silicon, Selenium Manager then fetched the
        # x86-64 chromedriver, and Chrome ran emulated: JavaScript about eleven
        # times slower and DOM work forty times slower, which turned a two
        # second page into a sixty second one. The GPU is unaffected by Rosetta,
        # which is what made this look like anything but an architecture
        # problem.
        architecture: ${{ steps.hostarch.outputs.java }}

    # The form runner is published as a release asset here rather than vendored:
    # it is a 47MB JVM distribution built from a private repo, so shipping the
    # source would defeat the split and committing the binary would bloat git.
    - name: Fetch the form runner
      id: cli
      if: inputs.form != '' || inputs.publish-to-production == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ inputs.cli-version }}
      run: |
        set -euo pipefail
        dest="$RUNNER_TEMP/form-cli"
        rm -rf "$dest" && mkdir -p "$dest"
        repo="FlavorFlow-io/create-play-app-action"
        if [ "$VERSION" = "latest" ]; then
          gh release download --repo "$repo" --pattern 'form-cli.zip' --dir "$dest"
        else
          gh release download "$VERSION" --repo "$repo" --pattern 'form-cli.zip' --dir "$dest"
        fi
        unzip -q "$dest/form-cli.zip" -d "$dest"
        chmod +x "$dest/form-cli"
        echo "path=$dest/form-cli" >> "$GITHUB_OUTPUT"
        "$dest/form-cli" --list > /dev/null && echo "Form runner ready."

    - name: Resolve the client
      id: client
      if: inputs.form != '' || inputs.publish-to-production == 'true'
      shell: bash
      env:
        API_KEY: ${{ inputs.api-key }}
      run: |
        set -euo pipefail
        url="${{ inputs.api-base-url }}/v1/projects/${{ inputs.project-id }}/clients"
        body=$(curl -fsS -H "Authorization: Bearer $API_KEY" "$url")
        client=$(jq -e --arg id "${{ inputs.client-id }}" '.data[] | select(.id==$id)' <<<"$body") || {
          echo "::error::No client ${{ inputs.client-id }} in project ${{ inputs.project-id }}."
          jq -r '.data[] | "  \(.id)  \(.name)"' <<<"$body" >&2
          exit 1
        }
        name=$(jq -r '.app_name // .name' <<<"$client")
        pkg=$(jq -r '.package_name // ""' <<<"$client")
        email=$(jq -r '.contact_email // ""' <<<"$client")
        phone=$(jq -r '.contact_phone // ""' <<<"$client")
        website=$(jq -r '.contact_website // ""' <<<"$client")
        [ -n "${{ inputs.app-name }}" ] && name="${{ inputs.app-name }}"
        echo "app_name=$name" >> "$GITHUB_OUTPUT"
        echo "package_name=$pkg" >> "$GITHUB_OUTPUT"
        echo "contact_email=$email" >> "$GITHUB_OUTPUT"
        echo "contact_phone=$phone" >> "$GITHUB_OUTPUT"
        echo "contact_website=$website" >> "$GITHUB_OUTPUT"
        echo "Client: $name ($pkg) <${email:-no support email}>"

    - name: Fetch the store-listing template
      id: listing
      if: inputs.form != '' || inputs.publish-to-production == 'true'
      shell: bash
      env:
        API_KEY: ${{ inputs.api-key }}
      run: |
        set -euo pipefail
        url="${{ inputs.api-base-url }}/v1/projects/${{ inputs.project-id }}/store-listing"
        body=$(curl -fsS -H "Authorization: Bearer $API_KEY" "$url" || echo '')
        if [ -z "$body" ] || [ "$(jq -r '.data' <<<"$body")" = "null" ]; then
          echo "::notice::No store-listing template on this project — store_listing_form will be skipped."
          echo "short=" >> "$GITHUB_OUTPUT"
          echo "full=" >> "$GITHUB_OUTPUT"
        else
          # Multi-line values need a heredoc delimiter, not key=value.
          {
            echo "short<<FF_EOF"; jq -r '.data.short_description' <<<"$body"; echo "FF_EOF"
            echo "full<<FF_EOF";  jq -r '.data.full_description'  <<<"$body"; echo "FF_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Loaded the store-listing template."
        fi

    - name: Fetch saved form answers
      id: answers
      if: inputs.form != '' || inputs.publish-to-production == 'true'
      shell: bash
      env:
        API_KEY: ${{ inputs.api-key }}
      run: |
        set -euo pipefail
        # Answers live on the project, so a human fills them once in the desktop
        # app instead of CI carrying them per client.
        # Scoped to the client so its own overrides win over the project's
        # answers. The API resolves that — asking for the project's and merging
        # here would put a second implementation of the precedence rule on the
        # runner, free to disagree with the one the web app shows.
        url="${{ inputs.api-base-url }}/v1/projects/${{ inputs.project-id }}/form-answers?client_id=${{ inputs.client-id }}"
        body=$(curl -fsS -H "Authorization: Bearer $API_KEY" "$url" || echo '')
        if [ -z "$body" ] || [ "$(jq -r '.data' <<<"$body")" = "null" ]; then
          echo "::notice::No saved form answers for this project — the form runs with --param only."
          echo "path=" >> "$GITHUB_OUTPUT"
        else
          jq -r '.data.answers_json' <<<"$body" > "$RUNNER_TEMP/form-answers.json"
          echo "Loaded $(jq -r '.data.size_bytes' <<<"$body") bytes of saved answers."
          overridden=$(jq -r '(.data.overridden // []) | length' <<<"$body")
          if [ "$overridden" != "0" ]; then
            echo "Applying $overridden client override(s): $(jq -r '(.data.overridden // []) | join(", ")' <<<"$body")"
          fi
          # Without a listing template there is nothing to write, and the store
          # listing form's answers are all placeholders — leaving it in would
          # fail the run on unresolved values rather than simply skipping it.
          if [ -z "${{ steps.listing.outputs.short }}" ]; then
            tmp=$(mktemp)
            jq 'del(.forms.store_listing_form)' "$RUNNER_TEMP/form-answers.json" > "$tmp" \
              && mv "$tmp" "$RUNNER_TEMP/form-answers.json"
            echo "::notice::Dropped store_listing_form — this project has no listing template."
          fi
          echo "path=$RUNNER_TEMP/form-answers.json" >> "$GITHUB_OUTPUT"
        fi

    # Only when no form set is requested. With `form` set, create_app_form runs
    # through the Kotlin runner instead — the same interpreter and the same JSON
    # the desktop app and the nightly form checks use.
    - name: Create the Play app (legacy python path)
      id: create
      if: inputs.form == '' && inputs.publish-to-production != 'true'

      shell: bash
      env:
        FLAVORFLOW_API_KEY: ${{ inputs.api-key }}
      run: |
        set -euo pipefail
        profile_dir=$(eval echo "${{ inputs.profile-dir }}")
        args=(
          --api-base "${{ inputs.api-base-url }}"
          --project-id "${{ inputs.project-id }}"
          --client-id "${{ inputs.client-id }}"
          --profile-dir "$profile_dir"
          --default-language "${{ inputs.default-language }}"
          --app-type "${{ inputs.app-type }}"
          --pricing "${{ inputs.pricing }}"
          --session-timeout "${{ inputs.session-timeout }}"
          --login-timeout "${{ inputs.login-timeout }}"
          --notify-interval "${{ inputs.notify-interval }}"
        )
        [ -n "${{ inputs.notify-webhook }}" ] && args+=(--notify-webhook "${{ inputs.notify-webhook }}")
        [ "${{ inputs.notify-desktop }}" = "false" ] && args+=(--no-desktop-notify)
        [ -n "${{ inputs.app-name }}" ] && args+=(--app-name "${{ inputs.app-name }}")
        args+=(--chrome-binary "${{ steps.chrome.outputs.binary }}")
        [ "${{ inputs.headless }}" = "true" ] && args+=(--headless)
        [ "${{ inputs.dry-run }}" = "true" ] && args+=(--dry-run)
        # Waiting for a sign-in can take half an hour, and an idle Mac sleeps
        # long before that — which drops the runner's connection and fails the
        # job with a network error that says nothing about sleep. caffeinate
        # holds both idle and display assertions for exactly this command.
        keep_awake=()
        command -v caffeinate >/dev/null 2>&1 && keep_awake=(caffeinate -d -i)
        "${keep_awake[@]}" "${{ steps.venv.outputs.python }}" "${{ github.action_path }}/ci_create_app.py" \
          --repo-root "${{ github.action_path }}/automation" "${args[@]}"

    # Stop before the browser, not after. A run that creates an app and then
    # cannot complete it leaves a half-configured app behind that has to be
    # sorted out by hand, and Play will not let a package name be reused.
    # Some answers are files — the Data safety CSV is imported rather than
    # typed. They live with the project's answers in FlavorFlow, so they are
    # fetched here rather than being expected somewhere on the runner.
    - name: Fetch files the forms are answered with
      id: formfiles
      if: inputs.form != '' || inputs.publish-to-production == 'true'
      shell: bash
      env:
        API_KEY: ${{ inputs.api-key }}
        ANSWERS: ${{ steps.answers.outputs.path }}
        CSV_PATH: ${{ steps.csv.outputs.path }}
      run: |
        set -euo pipefail
        params=""
        # Only data_privacy_security today; the loop is here so a second
        # file-answered form needs a list entry rather than another step.
        for pair in "data_privacy_security:csv_file:csv"; do
          form="${pair%%:*}"; rest="${pair#*:}"; input="${rest%%:*}"; ext="${rest##*:}"
          # Nothing to fetch when the caller brought its own.
          if [ "$input" = "csv_file" ] && [ -n "${CSV_PATH:-}" ]; then continue; fi
          [ -n "${ANSWERS:-}" ] || continue
          jq -e ".forms.\"$form\"" "$ANSWERS" >/dev/null 2>&1 || continue
          url="${{ inputs.api-base-url }}/v1/projects/${{ inputs.project-id }}/form-files/$input"
          body=$(curl -fsS -H "Authorization: Bearer $API_KEY" "$url" || echo '')
          if [ -z "$body" ] || [ "$(jq -r '.data' <<<"$body")" = "null" ]; then
            # Neither source has it: no path was passed and nothing is uploaded.
            # Stop here rather than opening a browser — $form is required to
            # publish, and a run that creates an app it cannot complete leaves a
            # package name that can never be reused.
            echo "::error::$form needs a file and there is none."
            echo "Either upload it in FlavorFlow (project → Play forms → $input),"
            echo "or pass a path to it: data-safety-csv: path/to/file.csv"
            exit 1
          fi
          dest="$RUNNER_TEMP/$input.$ext"
          jq -r '.data.content' <<<"$body" > "$dest"
          echo "$input: $(jq -r '.data.filename' <<<"$body") ($(wc -c <"$dest" | tr -d ' ') bytes)"
          params="${params}${input}=${dest}"$'\n'
        done
        # Through a file rather than an output: these are paths, but the block
        # is multi-line and outputs mangle that.
        printf '%s' "$params" > "$RUNNER_TEMP/form-file-params.txt"

    # One place decides where the Data safety CSV comes from: an explicit path
    # beats the upload, so a repository copy can be used without touching the
    # project, and neither is required as long as one exists.
    - name: Resolve the Data safety CSV
      id: csv
      if: inputs.form != '' || inputs.publish-to-production == 'true'
      shell: bash
      env:
        FORM_PARAMS: ${{ inputs.form-params }}
        EXPLICIT: ${{ inputs.data-safety-csv }}
      run: |
        set -euo pipefail
        # data-safety-csv is sugar for the form-param of the same meaning; both
        # are accepted so an existing caller keeps working.
        path="${EXPLICIT:-}"
        if [ -z "$path" ]; then
          path=$(printf '%s\n' "$FORM_PARAMS" | sed -n 's/^[[:space:]]*csv_file=//p' | head -1)
        fi
        if [ -n "$path" ] && [ ! -f "$path" ]; then
          echo "::error::A Data safety CSV path was given but no file is there: '$path'."
          echo "It is read on this runner — check the repository was checked out first."
          exit 1
        fi
        if [ -n "$path" ]; then
          echo "Data safety CSV from the caller: $path ($(wc -c <"$path" | tr -d ' ') bytes)"
        fi
        echo "path=$path" >> "$GITHUB_OUTPUT"

    - name: Check the project can actually publish
      if: inputs.form != '' || inputs.publish-to-production == 'true'
      shell: bash
      env:
        API_KEY: ${{ inputs.api-key }}
        FORM_PARAMS: ${{ inputs.form-params }}
        ANSWERS: ${{ steps.answers.outputs.path }}
        CSV_PATH: ${{ steps.csv.outputs.path }}
      run: |
        set -euo pipefail
        url="${{ inputs.api-base-url }}/v1/projects/${{ inputs.project-id }}/publish-readiness"
        body=$(curl -fsS -H "Authorization: Bearer $API_KEY" "$url" || echo '')
        if [ -z "$body" ]; then
          echo "::warning::Could not check publish readiness — continuing."
          exit 0
        fi
        # A caller-supplied CSV answers Data safety just as an upload does, so
        # do not hold a run back for a file it already has.
        if [ -n "${CSV_PATH:-}" ]; then
          body=$(jq '.data.missing = [(.data.missing // [])[] | select(.id != "data_privacy_security")]' <<<"$body")
          body=$(jq '.data.ready = ((.data.missing // []) | length == 0)' <<<"$body")
        fi
        missing=$(jq -r '(.data.missing // []) | map(.label) | join(", ")' <<<"$body")
        if [ -n "$missing" ]; then
          echo "::error::This project has no answers for required Play Console tasks: $missing."
          echo "Fill them in FlavorFlow (project → Play forms) before publishing."
          echo "A task listed here may have answers but be missing a file it is answered with."
          jq -r '(.data.missing // [])[] | select(.note) | "  - \(.label): \(.note)"' <<<"$body"
          exit 1
        fi

        echo "Publish readiness: every required task has answers, and the files they need are uploaded."

    - name: Look up the service account to grant
      id: grant
      if: inputs.grant-service-account == 'true'
      shell: bash
      env:
        API_KEY: ${{ inputs.api-key }}
      run: |
        set -euo pipefail
        url="${{ inputs.api-base-url }}/v1/projects/${{ inputs.project-id }}/store-integration"
        body=$(curl -fsS -H "Authorization: Bearer $API_KEY" "$url" || echo '')
        email=''
        if [ -z "$body" ]; then
          echo "::warning::Could not read the store integration — not granting app access."
        elif [ "$(jq -r '.data.grantNewApps' <<<"$body")" != "true" ]; then
          echo "This workspace does not grant new apps automatically."
        else
          email=$(jq -r '.data.serviceAccountEmail // empty' <<<"$body")
          if [ -z "$email" ]; then
            # Not an error: a workspace can want this on and simply not have
            # linked a key yet. Saying so beats silently doing nothing.
            echo "::warning::No Play service account is linked to this workspace, so there is nothing to grant."
          else
            echo "Will grant app access to $email."
          fi
        fi
        echo "email=$email" >> "$GITHUB_OUTPUT"

    - name: Run the Play Console forms
      id: forms
      if: inputs.form != '' || inputs.publish-to-production == 'true'
      shell: bash
      env:
        FORM_PARAMS: ${{ inputs.form-params }}
        SHORT_DESCRIPTION: ${{ steps.listing.outputs.short }}
        FULL_DESCRIPTION: ${{ steps.listing.outputs.full }}
        # Through the environment rather than interpolation, so the key is not
        # pasted into the script text — and it has to be here at all, because
        # progress reporting needs it and this step had no API_KEY.
        API_KEY: ${{ inputs.api-key }}
      run: |
        set -euo pipefail
        # --form is not in here: production runs as a second invocation, and
        # "all" cannot simply have forms appended to it — it means "every form
        # the answers cover", not an entry in a list.
        args=(--login-timeout "${{ inputs.login-timeout }}")
        args+=(--app-name "${{ steps.client.outputs.app_name }}")
        args+=(--param "app_name=${{ steps.client.outputs.app_name }}")
        [ -n "${{ steps.client.outputs.package_name }}" ] && \
          args+=(--param "package_name=${{ steps.client.outputs.package_name }}")
        # Resolves the {contact_email} the saved answers carry. Without it the
        # runner refuses the form rather than typing a placeholder into a listing.
        [ -n "${{ steps.client.outputs.contact_email }}" ] && \
          args+=(--param "contact_email=${{ steps.client.outputs.contact_email }}")
        # Play's listing asks for all three together, and the store settings
        # form has a field for each. Empty ones are simply not passed, and the
        # form leaves those fields alone.
        [ -n "${{ steps.client.outputs.contact_phone }}" ] && \
          args+=(--param "contact_phone=${{ steps.client.outputs.contact_phone }}")
        [ -n "${{ steps.client.outputs.contact_website }}" ] && \
          args+=(--param "contact_website=${{ steps.client.outputs.contact_website }}")
        # Through the environment rather than expression interpolation: the full
        # description is multi-line, and interpolation pastes raw text straight
        # into the script — breaking it, and letting listing copy run as shell.
        if [ -n "${SHORT_DESCRIPTION:-}" ]; then
          args+=(--param "short_description=$SHORT_DESCRIPTION")
          args+=(--param "full_description=$FULL_DESCRIPTION")
        fi
        [ -n "${{ inputs.countries }}" ] && args+=(--param "countries=${{ inputs.countries }}")
        # Report progress back to FlavorFlow as each form completes. The whole
        # run is one CI step, so without this there is nothing to look at for
        # twenty minutes but a spinner.
        args+=(--progress-api "${{ inputs.api-base-url }}")
        args+=(--progress-key "$API_KEY")
        args+=(--progress-project "${{ inputs.project-id }}")
        args+=(--progress-client "${{ inputs.client-id }}")
        [ -n "${{ inputs.developer-id }}" ] && args+=(--developer-id "${{ inputs.developer-id }}")
        # Already resolved for the python path; the runner needs it just as much,
        # since ChromeDriver cannot find Chrome on macOS by itself.
        args+=(--chrome-binary "${{ steps.chrome.outputs.binary }}")
        [ "${{ inputs.close-existing-chrome }}" = "true" ] && args+=(--close-existing-chrome)
        [ "${{ inputs.force-create }}" = "true" ] && args+=(--force-create)
        [ "${{ inputs.verify }}" = "true" ] && args+=(--verify)
        [ -n "${{ inputs.content-rating }}" ] && args+=(--content-rating "${{ inputs.content-rating }}")
        [ -n "${{ inputs.state-dir }}" ] && args+=(--state-dir "${{ inputs.state-dir }}")
        # Only from the legacy path; with `form` set the runner creates the app
        # itself and resolves the id between forms.
        app_id="${{ inputs.app-id || steps.create.outputs.app-id }}"
        [ -n "$app_id" ] && args+=(--app-id "$app_id")
        [ -n "${{ steps.answers.outputs.path }}" ] && args+=(--answers "${{ steps.answers.outputs.path }}")
        [ -n "${{ inputs.notify-webhook }}" ] && args+=(--notify-webhook "${{ inputs.notify-webhook }}")
        # Uploaded files first, then the caller's params: the runner keeps the
        # last --param for a given key, so this is what makes an explicit path
        # win over the upload. The comment previously claimed the opposite
        # order did that, and it did not.
        if [ -f "$RUNNER_TEMP/form-file-params.txt" ]; then
          while IFS= read -r pair; do
            [ -n "$pair" ] && args+=(--param "$pair")
          done < "$RUNNER_TEMP/form-file-params.txt"
        fi
        while IFS= read -r pair; do
          [ -n "$pair" ] && args+=(--param "$pair")
        done <<< "$FORM_PARAMS"
        # The named input is sugar for csv_file, applied last so it beats both.
        [ -n "${{ steps.csv.outputs.path }}" ] && args+=(--param "csv_file=${{ steps.csv.outputs.path }}")
        keep_awake=()
        command -v caffeinate >/dev/null 2>&1 && keep_awake=(caffeinate -d -i)

        run_forms() {
          local forms="$1"; shift
          echo "--- running: $forms"
          "${keep_awake[@]}" "${{ steps.cli.outputs.path }}" --form "$forms" "${args[@]}" "$@"
        }

        if [ -n "${{ inputs.form }}" ]; then
          run_forms "${{ inputs.form }}"
        fi

        # After the app exists, so there is something to tick the boxes
        # against. Re-running it is harmless: the form finds the app already
        # listed and re-applies the same three permissions.
        if [ -n "${{ steps.grant.outputs.email }}" ]; then
          run_forms grant_app_permission_form \
            --param "account=${{ steps.grant.outputs.email }}" \
            --param "appName=${{ inputs.app-name }}"
        fi

        if [ "${{ inputs.publish-to-production }}" = "true" ]; then
          # Three forms, in this order: promote creates the production draft,
          # countries fills the one field a production release cannot go
          # without, and release rolls it out. The rollout itself is behind
          # --param publish_to_production, so passing the forms alone would
          # stop on the review page.
          echo "::warning::Promoting ${{ steps.client.outputs.package_name }} to production. This is public and cannot be undone."
          run_forms promote_to_production_form,production_countries_form,production_release_form \
            --param publish_to_production=1
        fi

    - name: Remove fetched answers
      if: always() && (inputs.form != '' || inputs.publish-to-production == 'true')
      shell: bash
      run: rm -f "$RUNNER_TEMP/form-answers.json"
